name: Compilar PowerSpectrum 30FPS Capped APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Generar estructura del proyecto con 30 FPS Cap
        run: |
          mkdir -p app/src/main/java/com/ejemplo/espectrowallpaper
          mkdir -p app/src/main/res/xml
          mkdir -p app/src/main/res/values
          mkdir -p app/src/main/res/drawable

          cat << 'EOF' > gradle.properties
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          kotlin.code.style=official
          android.nonTransitiveRClass=true
          EOF

          cat << 'EOF' > settings.gradle.kts
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "EspectroWallpaper"
          include(":app")
          EOF

          cat << 'EOF' > build.gradle.kts
          plugins {
              id("com.android.application") version "8.4.0" apply false
              id("org.jetbrains.kotlin.android") version "1.9.23" apply false
          }
          EOF

          cat << 'EOF' > app/build.gradle.kts
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }

          android {
              namespace = "com.ejemplo.espectrowallpaper"
              compileSdk = 34

              defaultConfig {
                  applicationId = "com.ejemplo.espectrowallpaper"
                  minSdk = 26
                  targetSdk = 34
                  versionCode = 9
                  versionName = "3.4"
              }

              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions {
                  jvmTarget = "17"
              }
          }

          dependencies {
              implementation("androidx.core:core-ktx:1.12.0")
              implementation("androidx.appcompat:appcompat:1.6.1")
              implementation("androidx.activity:activity-ktx:1.8.2")
          }
          EOF

          cat << 'EOF' > app/src/main/res/values/strings.xml
          <resources>
              <string name="app_name">PowerSpectrum Ultimate</string>
              <string name="wallpaper_desc">15 Visualizadores de audio estilo Poweramp a 30 FPS Estables</string>
          </resources>
          EOF

          cat << 'EOF' > app/src/main/res/drawable/ic_launcher.xml
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp"
              android:height="108dp"
              android:viewportWidth="108"
              android:viewportHeight="108">
              <path
                  android:fillColor="#07080D"
                  android:pathData="M0,0h108v108h-108z"/>
              <path
                  android:fillColor="#FF007F"
                  android:pathData="M18,64h6v20h-6zM28,48h6v36h-6zM38,30h6v54h-6z"/>
              <path
                  android:fillColor="#00F5D4"
                  android:pathData="M48,18h6v66h-6zM58,28h6v56h-6zM68,42h6v42h-6zM78,54h6v30h-6zM88,66h6v18h-6z"/>
          </vector>
          EOF

          cat << 'EOF' > app/src/main/res/xml/wallpaper.xml
          <?xml version="1.0" encoding="utf-8"?>
          <wallpaper xmlns:android="http://schemas.android.com/apk/res/android"
              android:description="@string/wallpaper_desc"
              android:thumbnail="@drawable/ic_launcher"
              android:settingsActivity="com.ejemplo.espectrowallpaper.MainActivity" />
          EOF

          cat << 'EOF' > app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.RECORD_AUDIO" />
              <uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS" />

              <uses-feature
                  android:name="android.software.live_wallpaper"
                  android:required="true" />

              <application
                  android:allowBackup="true"
                  android:icon="@drawable/ic_launcher"
                  android:label="@string/app_name"
                  android:supportsRtl="true"
                  android:theme="@style/Theme.AppCompat.DayNight.NoActionBar">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>

                  <service
                      android:name=".AudioSpectrumWallpaperService"
                      android:enabled="true"
                      android:exported="true"
                      android:label="@string/app_name"
                      android:permission="android.permission.BIND_WALLPAPER">
                      <intent-filter>
                          <action android:name="android.service.wallpaper.WallpaperService" />
                      </intent-filter>
                      <meta-data
                          android:name="android.service.wallpaper"
                          android:resource="@xml/wallpaper" />
                  </service>

              </application>
          </manifest>
          EOF

          cat << 'EOF' > app/src/main/java/com/ejemplo/espectrowallpaper/MainActivity.kt
          package com.ejemplo.espectrowallpaper

          import android.Manifest
          import android.app.WallpaperManager
          import android.content.ComponentName
          import android.content.Context
          import android.content.Intent
          import android.content.pm.PackageManager
          import android.graphics.Color
          import android.graphics.Typeface
          import android.graphics.drawable.GradientDrawable
          import android.os.Bundle
          import android.view.Gravity
          import android.widget.Button
          import android.widget.LinearLayout
          import android.widget.ScrollView
          import android.widget.TextView
          import android.widget.Toast
          import androidx.activity.result.contract.ActivityResultContracts
          import androidx.appcompat.app.AppCompatActivity
          import androidx.core.content.ContextCompat

          class MainActivity : AppCompatActivity() {

              private val requestPermissionLauncher = registerForActivityResult(
                  ActivityResultContracts.RequestPermission()
              ) { isGranted: Boolean ->
                  if (isGranted) {
                      openWallpaperPicker()
                  } else {
                      Toast.makeText(this, "Se necesita permiso de audio.", Toast.LENGTH_LONG).show()
                  }
              }

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  val prefs = getSharedPreferences("spectrum_prefs", Context.MODE_PRIVATE)

                  val scrollView = ScrollView(this).apply {
                      setBackgroundColor(Color.parseColor("#08090F"))
                  }
                  val container = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      setPadding(48, 64, 48, 64)
                  }

                  val title = TextView(this).apply {
                      text = "PowerSpectrum Ultimate"
                      textSize = 28f
                      setTextColor(Color.parseColor("#00F5D4"))
                      typeface = Typeface.DEFAULT_BOLD
                  }
                  val subtitle = TextView(this).apply {
                      text = "15 Efectos Visuales estilo Poweramp (30 FPS Estables). (Doble toque en tu pantalla de inicio para cambiar de estilo al instante)."
                      textSize = 14f
                      setTextColor(Color.parseColor("#A0AAB8"))
                      setPadding(0, 12, 0, 40)
                  }

                  container.addView(title)
                  container.addView(subtitle)
                  container.addView(sectionHeader("1. ELIGE ENTRE LOS 15 EFECTOS"))

                  val styles = listOf(
                      0 to "1. Poweramp Classic LED + Picos",
                      1 to "2. Reactor Radial 360° (Bass Orb)",
                      2 to "3. Ondas Líquidas Neón (Milkdrop)",
                      3 to "4. Horizonte Espejo + Partículas",
                      4 to "5. Ecualizador de Bloques Hi-Fi",
                      5 to "6. Anillos Céntricos de Pulso",
                      6 to "7. Matriz de Puntos Estroboscópica",
                      7 to "8. Efecto Láser Tunnel 3D",
                      8 to "9. Ondas de Lissajous Armónicas",
                      9 to "10. Lluvia de Frecuencias (Matrix)",
                      10 to "11. Espectro Radial Estelar (StarBurst)",
                      11 to "12. Barras Gemelas Espejo Central",
                      12 to "13. Ondas Senoidales Superpuestas",
                      13 to "14. Vúmetro Analógico Dinámico",
                      14 to "15. Nebulosa de Partículas"
                  )

                  val styleButtons = mutableListOf<Button>()
                  val currentStyle = prefs.getInt("style", 0)

                  styles.forEach { (id, name) ->
                      val btn = createOptionButton(name, id == currentStyle)
                      btn.setOnClickListener {
                          prefs.edit().putInt("style", id).apply()
                          styleButtons.forEachIndexed { index, b -> updateButtonStyle(b, index == id) }
                          Toast.makeText(this, "Efecto: $name", Toast.LENGTH_SHORT).show()
                      }
                      styleButtons.add(btn)
                      container.addView(btn)
                  }

                  container.addView(sectionHeader("2. PALETA DE COLORES"))
                  val palettes = listOf(
                      0 to "Cyberpunk Neón",
                      1 to "Fuego Bass",
                      2 to "Matrix Digital",
                      3 to "Océano Profundo",
                      4 to "Oro & Platino"
                  )

                  val paletteButtons = mutableListOf<Button>()
                  val currentPalette = prefs.getInt("palette", 0)

                  palettes.forEach { (id, name) ->
                      val btn = createOptionButton(name, id == currentPalette)
                      btn.setOnClickListener {
                          prefs.edit().putInt("palette", id).apply()
                          paletteButtons.forEachIndexed { index, b -> updateButtonStyle(b, index == id) }
                          Toast.makeText(this, "Paleta: $name", Toast.LENGTH_SHORT).show()
                      }
                      paletteButtons.add(btn)
                      container.addView(btn)
                  }

                  val applyBtn = Button(this).apply {
                      text = "APLICAR FONDO DE PANTALLA"
                      textSize = 16f
                      typeface = Typeface.DEFAULT_BOLD
                      setTextColor(Color.parseColor("#08090F"))
                      background = GradientDrawable().apply {
                          cornerRadius = 32f
                          setColor(Color.parseColor("#00F5D4"))
                      }
                      layoutParams = LinearLayout.LayoutParams(
                          LinearLayout.LayoutParams.MATCH_PARENT,
                          LinearLayout.LayoutParams.WRAP_CONTENT
                      ).apply { topMargin = 56 }
                      setPadding(32, 36, 32, 36)
                      setOnClickListener { checkPermissionAndLaunch() }
                  }

                  container.addView(applyBtn)
                  scrollView.addView(container)
                  setContentView(scrollView)
              }

              private fun sectionHeader(text: String): TextView {
                  return TextView(this).apply {
                      this.text = text
                      textSize = 15f
                      typeface = Typeface.DEFAULT_BOLD
                      setTextColor(Color.WHITE)
                      setPadding(0, 32, 0, 16)
                  }
              }

              private fun createOptionButton(label: String, selected: Boolean): Button {
                  return Button(this).apply {
                      text = label
                      isAllCaps = false
                      textSize = 14f
                      gravity = Gravity.START or Gravity.CENTER_VERTICAL
                      setPadding(40, 28, 40, 28)
                      layoutParams = LinearLayout.LayoutParams(
                          LinearLayout.LayoutParams.MATCH_PARENT,
                          LinearLayout.LayoutParams.WRAP_CONTENT
                      ).apply { bottomMargin = 16 }
                      updateButtonStyle(this, selected)
                  }
              }

              private fun updateButtonStyle(button: Button, selected: Boolean) {
                  val drawable = GradientDrawable().apply {
                      cornerRadius = 24f
                      if (selected) {
                          setColor(Color.parseColor("#1E2235"))
                          setStroke(4, Color.parseColor("#00F5D4"))
                      } else {
                          setColor(Color.parseColor("#121420"))
                          setStroke(2, Color.parseColor("#262B40"))
                      }
                  }
                  button.background = drawable
                  button.setTextColor(if (selected) Color.parseColor("#00F5D4") else Color.WHITE)
              }

              private fun checkPermissionAndLaunch() {
                  if (ContextCompat.checkSelfPermission(this, Manifest.permission.RECORD_AUDIO) == PackageManager.PERMISSION_GRANTED) {
                      openWallpaperPicker()
                  } else {
                      requestPermissionLauncher.launch(Manifest.permission.RECORD_AUDIO)
                  }
              }

              private fun openWallpaperPicker() {
                  val intent = Intent(WallpaperManager.ACTION_CHANGE_LIVE_WALLPAPER).apply {
                      putExtra(WallpaperManager.EXTRA_LIVE_WALLPAPER_COMPONENT, ComponentName(this@MainActivity, AudioSpectrumWallpaperService::class.java))
                  }
                  startActivity(intent)
              }
          }
          EOF

          cat << 'EOF' > app/src/main/java/com/ejemplo/espectrowallpaper/AudioSpectrumWallpaperService.kt
          package com.ejemplo.espectrowallpaper

          import android.content.Context
          import android.graphics.Canvas
          import android.graphics.Color
          import android.graphics.LinearGradient
          import android.graphics.Paint
          import android.graphics.Path
          import android.graphics.RadialGradient
          import android.graphics.RectF
          import android.graphics.Shader
          import android.media.AudioFormat
          import android.media.AudioRecord
          import android.media.MediaRecorder
          import android.os.SystemClock
          import android.service.wallpaper.WallpaperService
          import android.view.Choreographer
          import android.view.MotionEvent
          import android.view.SurfaceHolder
          import kotlin.math.PI
          import kotlin.math.abs
          import kotlin.math.cos
          import kotlin.math.hypot
          import kotlin.math.log10
          import kotlin.math.max
          import kotlin.math.min
          import kotlin.math.pow
          import kotlin.math.sin
          import kotlin.random.Random

          class AudioSpectrumWallpaperService : WallpaperService() {
              override fun onCreateEngine(): Engine = PowerSpectrumEngine()

              inner class PowerSpectrumEngine : Engine(), Choreographer.FrameCallback {
                  private var audioRecord: AudioRecord? = null
                  private var recordingThread: Thread? = null
                  private var isRecording = false
                  private var isVisible = false
                  private var isRendering = false
                  private var lastFrameTime = 0L

                  init {
                      setTouchEventsEnabled(true)
                  }

                  private val numBands = 64
                  private val targetMagnitudes = FloatArray(numBands)
                  private val smoothedMagnitudes = FloatArray(numBands) { 12f }
                  private val peakHeights = FloatArray(numBands) { 15f }
                  private val peakVelocities = FloatArray(numBands) { 0f }

                  private var bassEnergy = 0f
                  private var rotationAngle = 0f
                  private var wavePhase = 0f
                  private var lastAudioTimestamp = 0L

                  private var lastTapTime = 0L
                  private var lastTapX = 0f
                  private var lastTapY = 0f

                  private val numParticles = 40
                  private val particleX = FloatArray(numParticles) { Random.nextFloat() }
                  private val particleY = FloatArray(numParticles) { Random.nextFloat() }
                  private val particleSpeed = FloatArray(numParticles) { Random.nextFloat() * 0.004f + 0.001f }
                  private val particleRadius = FloatArray(numParticles) { Random.nextFloat() * 5f + 2f }

                  private val rect = RectF()
                  private val wavePath = Path()

                  private val bgPaint = Paint().apply { color = Color.parseColor("#07080D") }
                  private val mainPaint = Paint(Paint.ANTI_ALIAS_FLAG).apply { style = Paint.Style.FILL }
                  private val reflectionPaint = Paint(Paint.ANTI_ALIAS_FLAG).apply { style = Paint.Style.FILL }
                  private val peakPaint = Paint(Paint.ANTI_ALIAS_FLAG).apply { style = Paint.Style.FILL }
                  private val strokePaint = Paint(Paint.ANTI_ALIAS_FLAG).apply { style = Paint.Style.STROKE; strokeCap = Paint.Cap.ROUND }
                  private val glowPaint = Paint(Paint.ANTI_ALIAS_FLAG).apply { style = Paint.Style.FILL }

                  override fun onVisibilityChanged(visible: Boolean) {
                      super.onVisibilityChanged(visible)
                      isVisible = visible
                      if (visible) {
                          startAudioCapture()
                          startRendering()
                      } else {
                          stopRendering()
                          stopAudioCapture()
                      }
                  }

                  override fun onSurfaceRedrawNeeded(holder: SurfaceHolder?) {
                      super.onSurfaceRedrawNeeded(holder)
                      if (isVisible) {
                          stopAudioCapture()
                          startAudioCapture()
                      }
                  }

                  private fun startRendering() {
                      if (!isRendering) {
                          isRendering = true
                          lastFrameTime = 0L
                          Choreographer.getInstance().postFrameCallback(this)
                      }
                  }

                  private fun stopRendering() {
                      isRendering = false
                      Choreographer.getInstance().removeFrameCallback(this)
                  }

                  override fun doFrame(frameTimeNanos: Long) {
                      if (isVisible && isRendering) {
                          if (lastFrameTime == 0L) lastFrameTime = frameTimeNanos
                          val elapsed = frameTimeNanos - lastFrameTime
                          
                          // Limitador estricto a 30 FPS (~33.3ms por cuadro) para evitar caídas de rendimiento
                          if (elapsed >= 33_333_333L) {
                              lastFrameTime = frameTimeNanos
                              updatePhysics()
                              drawFrame()
                          }
                          Choreographer.getInstance().postFrameCallback(this)
                      }
                  }

                  override fun onTouchEvent(event: MotionEvent?) {
                      super.onTouchEvent(event)
                      if (event?.action == MotionEvent.ACTION_DOWN) {
                          val now = SystemClock.elapsedRealtime()
                          val dx = event.x - lastTapX
                          val dy = event.y - lastTapY
                          if (now - lastTapTime < 320L && hypot(dx.toDouble(), dy.toDouble()) < 120) {
                              val prefs = getSharedPreferences("spectrum_prefs", Context.MODE_PRIVATE)
                              val nextStyle = (prefs.getInt("style", 0) + 1) % 15
                              prefs.edit().putInt("style", nextStyle).apply()
                              lastTapTime = 0L
                          } else {
                              lastTapTime = now
                              lastTapX = event.x
                              lastTapY = event.y
                          }
                      }
                  }

                  private fun startAudioCapture() {
                      if (isRecording) return
                      try {
                          val sampleRate = 44100
                          val channelConfig = AudioFormat.CHANNEL_IN_MONO
                          val audioFormat = AudioFormat.ENCODING_PCM_16BIT
                          val minBufferSize = AudioRecord.getMinBufferSize(sampleRate, channelConfig, audioFormat)
                          val bufferSize = max(minBufferSize, 2048)

                          audioRecord = AudioRecord(
                              MediaRecorder.AudioSource.REMOTE_SUBMIX,
                              sampleRate,
                              channelConfig,
                              audioFormat,
                              bufferSize
                          )

                          if (audioRecord?.state != AudioRecord.STATE_INITIALIZED) {
                              audioRecord = AudioRecord(
                                  MediaRecorder.AudioSource.MIC,
                                  sampleRate,
                                  channelConfig,
                                  audioFormat,
                                  bufferSize
                              )
                          }

                          audioRecord?.startRecording()
                          isRecording = true

                          recordingThread = Thread {
                              val buffer = ShortArray(1024)
                              while (isRecording) {
                                  val readSize = audioRecord?.read(buffer, 0, buffer.size) ?: 0
                                  if (readSize > 0) {
                                      processPcmBoosted(buffer, readSize)
                                  }
                              }
                          }.apply { start() }
                      } catch (e: Exception) {
                          e.printStackTrace()
                      }
                  }

                  private fun stopAudioCapture() {
                      isRecording = false
                      try {
                          recordingThread?.join(300)
                      } catch (e: Exception) {
                          e.printStackTrace()
                      }
                      recordingThread = null
                      try {
                          audioRecord?.stop()
                          audioRecord?.release()
                      } catch (e: Exception) {
                          e.printStackTrace()
                      }
                      audioRecord = null
                  }

                  private fun processPcmBoosted(buffer: ShortArray, readSize: Int) {
                      var activeSignal = 0f
                      val step = max(1, readSize / numBands)

                      for (i in 0 until numBands) {
                          val idx = (i * step).coerceIn(0, readSize - 1)
                          val sample = abs(buffer[idx].toFloat())
                          val db = if (sample > 1f) 20f * log10(sample.toDouble()).toFloat() else 0f
                          val boosted = (db * 3.5f).coerceAtLeast(10f)

                          targetMagnitudes[i] = boosted
                          activeSignal += sample
                      }

                      if (activeSignal > 20f) {
                          lastAudioTimestamp = SystemClock.elapsedRealtime()
                      }
                  }

                  private fun updatePhysics() {
                      val now = SystemClock.elapsedRealtime()
                      val idleMode = (now - lastAudioTimestamp) > 1500L
                      wavePhase += 0.08f
                      rotationAngle = (rotationAngle + 0.4f) % 360f
                      var bassSum = 0f

                      for (i in 0 until numBands) {
                          val target = if (idleMode) (sin(wavePhase + i * 0.2f) * 18f + 24f).coerceAtLeast(12f) else targetMagnitudes[i]
                          smoothedMagnitudes[i] = if (target > smoothedMagnitudes[i]) {
                              smoothedMagnitudes[i] + (target - smoothedMagnitudes[i]) * 0.7f
                          } else {
                              max(12f, smoothedMagnitudes[i] * 0.85f)
                          }

                          if (smoothedMagnitudes[i] >= peakHeights[i]) {
                              peakHeights[i] = smoothedMagnitudes[i]
                              peakVelocities[i] = 0f
                          } else {
                              peakVelocities[i] += 0.5f
                              peakHeights[i] = max(smoothedMagnitudes[i], peakHeights[i] - peakVelocities[i])
                          }
                          if (i < 10) bassSum += smoothedMagnitudes[i]
                      }
                      bassEnergy += ((bassSum / 10f) - bassEnergy) * 0.5f
                      val speedMultiplier = 1f + (bassEnergy / 80f)
                      for (p in 0 until numParticles) {
                          particleY[p] -= particleSpeed[p] * speedMultiplier
                          if (particleY[p] < 0f) { particleY[p] = 1f; particleX[p] = Random.nextFloat() }
                      }
                  }

                  private fun getPaletteColors(paletteId: Int): IntArray {
                      return when (paletteId) {
                          1 -> intArrayOf(Color.parseColor("#FFEA00"), Color.parseColor("#FF6D00"), Color.parseColor("#D50000"))
                          2 -> intArrayOf(Color.parseColor("#CCFF90"), Color.parseColor("#00E676"), Color.parseColor("#004D40"))
                          3 -> intArrayOf(Color.parseColor("#80D8FF"), Color.parseColor("#0091EA"), Color.parseColor("#304FFE"))
                          4 -> intArrayOf(Color.parseColor("#FFFFFF"), Color.parseColor("#FFD740"), Color.parseColor("#FF6F00"))
                          else -> intArrayOf(Color.parseColor("#00F5D4"), Color.parseColor("#7B2CBF"), Color.parseColor("#FF007F"))
                      }
                  }

                  private fun drawFrame() {
                      val holder: SurfaceHolder = surfaceHolder
                      var canvas: Canvas? = null
                      try {
                          canvas = holder.lockCanvas()
                          if (canvas != null) {
                              val w = canvas.width.toFloat()
                              val h = canvas.height.toFloat()
                              val prefs = getSharedPreferences("spectrum_prefs", Context.MODE_PRIVATE)
                              val style = prefs.getInt("style", 0)
                              val paletteId = prefs.getInt("palette", 0)
                              val colors = getPaletteColors(paletteId)

                              canvas.drawRect(0f, 0f, w, h, bgPaint)
                              drawBassAura(canvas, w, h, colors)

                              when (style) {
                                  0 -> drawPowerampClassicLED(canvas, w, h, colors)
                                  1 -> drawRadialBassReactor(canvas, w, h, colors)
                                  2 -> drawMilkdropLiquidWaves(canvas, w, h, colors)
                                  3 -> drawMirrorHorizonWithParticles(canvas, w, h, colors)
                                  4 -> drawHiFiSegmentedBlocks(canvas, w, h, colors)
                                  5 -> drawHypnoticRings(canvas, w, h, colors)
                                  6 -> drawDotGridStrobe(canvas, w, h, colors)
                                  7 -> drawLaserTunnel3D(canvas, w, h, colors)
                                  8 -> drawLissajousHarmonics(canvas, w, h, colors)
                                  9 -> drawMatrixRain(canvas, w, h, colors)
                                  10 -> drawStarBurst(canvas, w, h, colors)
                                  11 -> drawDualCenterMirror(canvas, w, h, colors)
                                  12 -> drawSuperimposedSines(canvas, w, h, colors)
                                  13 -> drawVumeterAnalog(canvas, w, h, colors)
                                  14 -> drawParticleNebula(canvas, w, h, colors)
                              }
                          }
                      } finally { if (canvas != null) holder.unlockCanvasAndPost(canvas) }
                  }

                  private fun drawBassAura(canvas: Canvas, w: Float, h: Float, colors: IntArray) {
                      val radius = (w * 0.45f) + (bassEnergy * 1.5f)
                      glowPaint.shader = RadialGradient(w / 2f, h / 2f, radius.coerceAtLeast(10f), Color.argb(65, Color.red(colors[1]), Color.green(colors[1]), Color.blue(colors[1])), Color.TRANSPARENT, Shader.TileMode.CLAMP)
                      canvas.drawCircle(w / 2f, h / 2f, radius, glowPaint)
                  }

                  private fun drawPowerampClassicLED(canvas: Canvas, w: Float, h: Float, colors: IntArray) {
                      val baseLine = h * 0.74f; val maxBarHeight = h * 0.50f
                      val slotWidth = w / numBands; val barWidth = slotWidth * 0.68f; val gap = slotWidth * 0.32f
                      mainPaint.shader = LinearGradient(0f, baseLine - maxBarHeight, 0f, baseLine, colors, null, Shader.TileMode.CLAMP)
                      reflectionPaint.shader = LinearGradient(0f, baseLine, 0f, baseLine + maxBarHeight * 0.35f, intArrayOf(Color.argb(90, Color.red(colors[2]), Color.green(colors[2]), Color.blue(colors[2])), Color.TRANSPARENT), null, Shader.TileMode.CLAMP)
                      peakPaint.color = colors[0]

                      for (i in 0 until numBands) {
                          val bh = min(smoothedMagnitudes[i] * 1.25f, maxBarHeight)
                          val ph = min(peakHeights[i] * 1.25f, maxBarHeight + 18f)
                          val left = i * slotWidth + gap / 2f; val right = left + barWidth
                          rect.set(left, baseLine - bh, right, baseLine); canvas.drawRoundRect(rect, 8f, 8f, mainPaint)
                          rect.set(left, baseLine - ph - 10f, right, baseLine - ph - 3f); canvas.drawRoundRect(rect, 4f, 4f, peakPaint)
                          rect.set(left, baseLine + 6f, right, baseLine + 6f + (bh * 0.32f)); canvas.drawRoundRect(rect, 8f, 8f, reflectionPaint)
                      }
                  }

                  private fun drawRadialBassReactor(canvas: Canvas, w: Float, h: Float, colors: IntArray) {
                      val cx = w / 2f; val cy = h / 2f
                      val baseRadius = (min(w, h) * 0.19f) + (bassEnergy * 0.32f)
                      strokePaint.shader = null; strokePaint.color = colors[0]; strokePaint.strokeWidth = 6f
                      canvas.drawCircle(cx, cy, baseRadius * 0.88f, strokePaint)
                      strokePaint.strokeWidth = (w / numBands) * 0.55f
                      strokePaint.shader = LinearGradient(cx - baseRadius * 2f, cy - baseRadius * 2f, cx + baseRadius * 2f, cy + baseRadius * 2f, colors, null, Shader.TileMode.CLAMP)

                      for (i in 0 until numBands) {
                          val angleDeg = (i.toFloat() / numBands) * 360f + rotationAngle
                          val rad = (angleDeg * PI / 180.0).toFloat()
                          val barLen = min(smoothedMagnitudes[i] * 0.95f, min(w, h) * 0.32f)
                          canvas.drawLine(cx + cos(rad) * baseRadius, cy + sin(rad) * baseRadius, cx + cos(rad) * (baseRadius + barLen), cy + sin(rad) * (baseRadius + barLen), strokePaint)
                          peakPaint.color = colors[0]
                          canvas.drawCircle(cx + cos(rad) * (baseRadius + barLen + 12f), cy + sin(rad) * (baseRadius + barLen + 12f), 4f, peakPaint)
                      }
                  }

                  private fun drawMilkdropLiquidWaves(canvas: Canvas, w: Float, h: Float, colors: IntArray) {
                      val centerY = h * 0.52f; strokePaint.shader = null
                      for (layer in 0 until 3) {
                          wavePath.reset()
                          val layerScale = 1f - (layer * 0.25f)
                          val stepX = w / (numBands / 2 - 1)
                          var prevX = 0f; var prevY = centerY
                          for (i in 0 until (numBands / 2)) {
                              val x = i * stepX
                              val rawAmp = smoothedMagnitudes[i * 2] * layerScale * 1.1f
                              val direction = if (i % 2 == 0) 1f else -1f
                              val y = centerY + (rawAmp * direction) + sin(wavePhase * (layer + 1) + i * 0.4f) * 28f
                              if (i == 0) wavePath.moveTo(x, y) else {
                                  val midX = (prevX + x) / 2f
                                  wavePath.cubicTo(midX, prevY, midX, y, x, y)
                              }
                              prevX = x; prevY = y
                          }
                          strokePaint.color = Color.argb(90, Color.red(colors[layer]), Color.green(colors[layer]), Color.blue(colors[layer]))
                          strokePaint.strokeWidth = 24f; canvas.drawPath(wavePath, strokePaint)
                          strokePaint.color = colors[layer]; strokePaint.strokeWidth = 8f; canvas.drawPath(wavePath, strokePaint)
                      }
                  }

                  private fun drawMirrorHorizonWithParticles(canvas: Canvas, w: Float, h: Float, colors: IntArray) {
                      peakPaint.color = Color.argb(160, Color.red(colors[0]), Color.green(colors[0]), Color.blue(colors[0]))
                      for (p in 0 until numParticles) {
                          canvas.drawCircle(particleX[p] * w, particleY[p] * h, particleRadius[p] + (bassEnergy * 0.03f), peakPaint)
                      }
                      val centerY = h * 0.5f; val maxHalfHeight = h * 0.38f
                      val slotWidth = w / numBands; val barWidth = slotWidth * 0.65f; val gap = slotWidth * 0.35f
                      mainPaint.shader = LinearGradient(0f, centerY - maxHalfHeight, 0f, centerY + maxHalfHeight, intArrayOf(colors[0], colors[1], colors[2], colors[1], colors[0]), null, Shader.TileMode.CLAMP)

                      for (i in 0 until numBands) {
                          val halfH = min(smoothedMagnitudes[i] * 0.88f, maxHalfHeight)
                          rect.set(i * slotWidth + gap / 2f, centerY - halfH, i * slotWidth + gap / 2f + barWidth, centerY + halfH)
                          canvas.drawRoundRect(rect, barWidth / 2f, barWidth / 2f, mainPaint)
                      }
                      strokePaint.shader = null; strokePaint.color = colors[0]; strokePaint.strokeWidth = 4f
                      canvas.drawLine(0f, centerY, w, centerY, strokePaint)
                  }

                  private fun drawHiFiSegmentedBlocks(canvas: Canvas, w: Float, h: Float, colors: IntArray) {
                      val cols = 32; val maxBlocks = 24; val baseLine = h * 0.82f; val totalHeight = h * 0.60f
                      val blockHeight = (totalHeight / maxBlocks) * 0.68f; val blockGapY = (totalHeight / maxBlocks) * 0.32f
                      val slotWidth = w / cols; val blockWidth = slotWidth * 0.72f; val gapX = slotWidth * 0.28f
                      mainPaint.shader = null

                      for (c in 0 until cols) {
                          val mag = smoothedMagnitudes[c * 2] * 1.2f
                          val activeBlocks = ((mag / 250f) * maxBlocks).toInt().coerceIn(1, maxBlocks)
                          val peakBlock = ((peakHeights[c * 2] / 250f) * maxBlocks).toInt().coerceIn(1, maxBlocks)
                          val left = c * slotWidth + gapX / 2f; val right = left + blockWidth

                          for (b in 0 until activeBlocks) {
                              mainPaint.color = when {
                                  b > maxBlocks * 0.75 -> colors[0]
                                  b > maxBlocks * 0.35 -> colors[1]
                                  else -> colors[2]
                              }
                              rect.set(left, baseLine - b * (blockHeight + blockGapY) - blockHeight, right, baseLine - b * (blockHeight + blockGapY))
                              canvas.drawRoundRect(rect, 4f, 4f, mainPaint)
                          }
                          peakPaint.color = Color.WHITE
                          rect.set(left, baseLine - peakBlock * (blockHeight + blockGapY) - blockHeight, right, baseLine - peakBlock * (blockHeight + blockGapY))
                          canvas.drawRoundRect(rect, 4f, 4f, peakPaint)
                      }
                  }

                  private fun drawHypnoticRings(canvas: Canvas, w: Float, h: Float, colors: IntArray) {
                      val cx = w / 2f; val cy = h / 2f
                      strokePaint.shader = null
                      for (r in 1..6) {
                          val ringRadius = (min(w, h) * 0.12f * r) + (bassEnergy * (r * 0.4f))
                          strokePaint.color = colors[(r - 1) % colors.size]
                          strokePaint.strokeWidth = 5f + (r * 0.9f)
                          canvas.drawCircle(cx, cy, ringRadius, strokePaint)
                      }
                  }

                  private fun drawDotGridStrobe(canvas: Canvas, w: Float, h: Float, colors: IntArray) {
                      val rows = 10; val cols = 16
                      val cellW = w / cols; val cellH = h / rows
                      for (r in 0 until rows) {
                          for (c in 0 until cols) {
                              val index = (r * cols + c) % numBands
                              val mag = smoothedMagnitudes[index] * 1.3f
                              val radius = (mag * 0.1f).coerceIn(2f, cellW * 0.48f)
                              mainPaint.color = colors[(r + c) % colors.size]
                              canvas.drawCircle(c * cellW + cellW / 2f, r * cellH + cellH / 2f, radius, mainPaint)
                          }
                      }
                  }

                  private fun drawLaserTunnel3D(canvas: Canvas, w: Float, h: Float, colors: IntArray) {
                      val cx = w / 2f; val cy = h / 2f
                      strokePaint.shader = null
                      for (i in 0 until 12) {
                          val boxScale = (i * 0.08f) + ((wavePhase * 0.05f) % 0.08f)
                          val bw = w * boxScale + (bassEnergy * 0.8f)
                          val bh = h * boxScale + (bassEnergy * 0.8f)
                          strokePaint.color = colors[i % colors.size]
                          strokePaint.strokeWidth = 3f + (i * 0.5f)
                          rect.set(cx - bw / 2f, cy - bh / 2f, cx + bw / 2f, cy + bh / 2f)
                          canvas.drawRect(rect, strokePaint)
                      }
                  }

                  private fun drawLissajousHarmonics(canvas: Canvas, w: Float, h: Float, colors: IntArray) {
                      val cx = w / 2f; val cy = h / 2f
                      strokePaint.shader = null; strokePaint.color = colors[0]; strokePaint.strokeWidth = 6f
                      wavePath.reset()
                      val steps = 120
                      for (i in 0..steps) {
                          val t = (i.toFloat() / steps) * (2f * PI.toFloat())
                          val scale = min(w, h) * 0.35f + (bassEnergy * 1.2f)
                          val x = cx + sin(3f * t + wavePhase) * scale
                          val y = cy + cos(2f * t) * scale
                          if (i == 0) wavePath.moveTo(x, y) else wavePath.lineTo(x, y)
                      }
                      canvas.drawPath(wavePath, strokePaint)
                  }

                  private fun drawMatrixRain(canvas: Canvas, w: Float, h: Float, colors: IntArray) {
                      val cols = 24; val slotW = w / cols
                      mainPaint.color = colors[1]
                      for (c in 0 until cols) {
                          val mag = smoothedMagnitudes[c * 2] * 1.5f
                          val dropH = min(mag * 2.5f, h)
                          val left = c * slotW + slotW * 0.2f
                          rect.set(left, 0f, left + slotW * 0.6f, dropH)
                          canvas.drawRoundRect(rect, 4f, 4f, mainPaint)
                      }
                  }

                  private fun drawStarBurst(canvas: Canvas, w: Float, h: Float, colors: IntArray) {
                      val cx = w / 2f; val cy = h / 2f
                      strokePaint.shader = null; strokePaint.strokeWidth = 5f
                      for (i in 0 until numBands) {
                          val angle = (i.toFloat() / numBands) * (2f * PI.toFloat()) + rotationAngle
                          val len = smoothedMagnitudes[i] * 1.8f + bassEnergy
                          strokePaint.color = colors[i % colors.size]
                          canvas.drawLine(cx, cy, cx + cos(angle) * (w * 0.2f + len), cy + sin(angle) * (h * 0.2f + len), strokePaint)
                      }
                  }

                  private fun drawDualCenterMirror(canvas: Canvas, w: Float, h: Float, colors: IntArray) {
                      val cy = h * 0.5f; val halfBands = numBands / 2
                      val slotW = w / halfBands; val barW = slotW * 0.65f
                      mainPaint.shader = LinearGradient(0f, cy - h * 0.35f, 0f, cy + h * 0.35f, colors, null, Shader.TileMode.CLAMP)

                      for (i in 0 until halfBands) {
                          val mag = min(smoothedMagnitudes[i] * 1.1f, h * 0.4f)
                          rect.set(i * slotW, cy - mag, i * slotW + barW, cy + mag)
                          canvas.drawRoundRect(rect, 6f, 6f, mainPaint)
                      }
                  }

                  private fun drawSuperimposedSines(canvas: Canvas, w: Float, h: Float, colors: IntArray) {
                      strokePaint.shader = null
                      for (layer in 0 until 3) {
                          wavePath.reset()
                          val stepX = w / 40f
                          var prevX = 0f; var prevY = h / 2f
                          for (i in 0..40) {
                              val x = i * stepX
                              val y = (h / 2f) + sin(wavePhase * (layer + 1) + (i * 0.3f)) * (50f + bassEnergy * (layer + 1.2f))
                              if (i == 0) wavePath.moveTo(x, y) else {
                                  val midX = (prevX + x) / 2f
                                  wavePath.cubicTo(midX, prevY, midX, y, x, y)
                              }
                              prevX = x; prevY = y
                          }
                          strokePaint.color = colors[layer]
                          strokePaint.strokeWidth = 7f
                          canvas.drawPath(wavePath, strokePaint)
                      }
                  }

                  private fun drawVumeterAnalog(canvas: Canvas, w: Float, h: Float, colors: IntArray) {
                      val cx = w / 2f; val cy = h * 0.65f
                      strokePaint.shader = null; strokePaint.color = colors[0]; strokePaint.strokeWidth = 6f
                      canvas.drawArc(cx - w * 0.35f, cy - w * 0.35f, cx + w * 0.35f, cy + w * 0.35f, 180f, 180f, false, strokePaint)

                      val angleDeg = 180.0 + (bassEnergy * 1.6f).coerceIn(0f, 180f)
                      val rad = (angleDeg * PI / 180.0).toFloat()
                      strokePaint.color = colors[2]; strokePaint.strokeWidth = 9f
                      canvas.drawLine(cx, cy, cx + cos(rad) * (w * 0.28f), cy + sin(rad) * (w * 0.28f), strokePaint)
                  }

                  private fun drawParticleNebula(canvas: Canvas, w: Float, h: Float, colors: IntArray) {
                      for (p in 0 until numParticles) {
                          peakPaint.color = colors[p % colors.size]
                          canvas.drawCircle(particleX[p] * w, particleY[p] * h, particleRadius[p] + (bassEnergy * 0.08f), peakPaint)
                      }
                  }

                  override fun onDestroy() {
                      super.onDestroy()
                      stopRendering()
                      stopAudioCapture()
                  }
              }
          }
          EOF

      - name: Inicializar Gradle Wrapper
        run: gradle wrapper --gradle-version 8.7

      - name: Compilar APK con Gradle Wrapper
        run: ./gradlew assembleDebug

      - name: Subir APK al apartado de Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: EspectroPoweramp-APK
          path: app/build/outputs/apk/debug/app-debug.apk
